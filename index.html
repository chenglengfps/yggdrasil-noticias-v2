<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yggdrasil Notícias - Painel Unificado</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --accent-color: #00d2ff;
      --accent-purple: #9d4edd;
      --text-color: #f0f4f8;
      --border-color: #2a3241;
      --success-color: #2ecc71;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: var(--accent-color);
      font-size: 1.5rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    h3 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.1rem;
    }
    .main-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-block {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
    }
    label {
      font-size: 0.85rem;
      color: #a0aec0;
      display: block;
      margin-top: 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .img-preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-top: 10px;
      display: none;
    }
    textarea {
      height: 160px;
      resize: vertical;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      background: var(--border-color);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      flex: 1 1 calc(50% - 8px);
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-purple); }
    .btn-add { background: var(--success-color); margin-top: 10px; width: 100%; }
    .btn-add:hover { background: #27ae60; }
    .btn-reset { background: #d35400; margin-top: 8px; width: 100%; }
    .btn-reset:hover { background: #e67e22; }
    .btn-telegram { background: #0088cc; flex: 1 1 100%; font-weight: bold; font-size: 0.95rem; }
    .btn-telegram:hover { background: #00a8ff; }
    .btn-ai { background: #6e40c9; }
    .btn-ai:hover { background: #8957e5; }
    .btn-danger { background: #c0392b; margin-top: 8px; width: 100%; }
    .btn-danger:hover { background: #e74c3c; }

    /* TABELA DE PORTAIS */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }
    th {
      background: #0d1117;
      color: var(--accent-color);
    }
    .status {
      font-size: 0.85rem;
      color: #00d2ff;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
    .flex-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>🌳 Yggdrasil Notícias</h1>

    <!-- BLOCO 1: CONFIGURAÇÕES E GERENCIADOR DE PORTAIS -->
    <div class="section-block">
      <h3>⚙️ Configurações & Portais</h3>

      <label for="botToken">Token do Bot Telegram:</label>
      <input type="password" id="botToken" placeholder="Insira seu Bot Token" onchange="salvarConfiguracoes()">

      <label for="chatId">ID ou Username do Canal Telegram:</label>
      <input type="text" id="chatId" value="@YggdrasilNoticias" onchange="salvarConfiguracoes()">

      <label for="geminiKey">API Key do Gemini (Para Resumo IA):</label>
      <input type="password" id="geminiKey" placeholder="Insira sua chave API do Gemini" onchange="salvarConfiguracoes()">

      <label for="selectFonte">Selecionar Portal Atual:</label>
      <div class="flex-row">
        <select id="selectFonte" onchange="trocarPortal()"></select>
        <button onclick="removerPortalAtual()" style="flex: 0 0 40px; background: #c0392b;" title="Remover Portal">🗑️</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

      <label style="font-weight: bold; color: var(--accent-color);">➕ Cadastrar Novo Portal RSS:</label>
      <input type="text" id="novoNomePortal" placeholder="Nome do Portal (ex: Crunchyroll)">
      <input type="text" id="novaUrlPortal" placeholder="URL do Feed RSS (https://...)">
      <label>Modo de Postagem:</label>
      <select id="novoModoPortal">
        <option value="Manual">Manual</option>
        <option value="Automático">Automático (Futuro Bot)</option>
      </select>
      <button class="btn-add" onclick="adicionarNovoPortal()">➕ Adicionar Portal</button>

      <button class="btn-reset" onclick="restaurarPortaisPadrao()">🔄 Restaurar Portais Padrão</button>
      <button class="btn-danger" onclick="limparHistoricoPostados()">🗑️ Limpar Histórico de Postados</button>
    </div>

    <!-- BLOCO 2: TABELA DE STATUS DOS PORTAIS -->
    <div class="section-block">
      <h3>📋 Status de Todos os Portais</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Portal</th>
              <th>Status</th>
              <th>Último Escaneamento</th>
              <th>Última Postagem</th>
            </tr>
          </thead>
          <tbody id="tabelaPortaisBody">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- BLOCO 3: PRÉVIA E POSTADOR DE NOTÍCIAS -->
    <div class="section-block">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
        <span id="nomePortal" style="font-weight: bold; color: var(--accent-color);">Portal</span>
        <small id="indexNoticia">-</small>
      </div>

      <h4 id="tituloNoticia" style="margin: 12px 0 8px 0; color: #fff;">Clique em "Recarregar Fonte" para buscar dados.</h4>

      <img id="imagemNoticia" class="img-preview" alt="Imagem da Notícia">

      <textarea id="textoPost" placeholder="O texto da notícia formatado para o Telegram aparecerá aqui..."></textarea>

      <div class="btn-group">
        <button onclick="carregarFonteAtual()">🔄 Recarregar Fonte</button>
        <button onclick="trocarNoticia(1)">⏬ Notícia Anterior</button>
        <button onclick="trocarNoticia(-1)">⏫ Notícia Seguinte</button>
        <button onclick="proximoPortal()">🌐 Ir para Outro Portal</button>
        <button class="btn-ai" onclick="resumirComGemini()">🤖 Resumir com IA</button>
        <button class="btn-telegram" onclick="enviarDiretoTelegram()">🚀 Postar Direto no Canal</button>
      </div>
    </div>

    <div id="statusGlobal" class="status"></div>
  </div>

  <script>
    // PORTAIS PADRÃO PRÉ-CADASTRAOS
    const FONTES_PADRAO = [
      { id: 'jbox', nome: 'JBox', url: 'https://www.jbox.com.br/feed/', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' },
      { id: 'ovicio', nome: 'O Vício', url: 'https://ovicio.com.br/category/animes/feed/', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' },
      { id: 'animeunited', nome: 'Anime United', url: 'https://www.animeunited.com.br/feed/', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' },
      { id: 'crunchyroll', nome: 'Crunchyroll Notícias', url: 'https://www.crunchyroll.com/news/rss', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' },
      { id: 'ign', nome: 'IGN Brasil', url: 'https://br.ign.com/feed.xml', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' },
      { id: 'legiaodosherois', nome: 'Legião dos Heróis', url: 'https://www.legiaodosherois.com.br/feed', modo: 'Manual', escaneado: 'Nunca', postado: 'Nunca' }
    ];

    let fontes = [];
    let itemsAtuais = [];
    let indexAtual = 0;
    let urlImagemAtual = null;

    window.onload = () => {
      try {
        const fontesSalvas = localStorage.getItem('yg_fontes_custom');
        
        // Se não houver salvas ou se o array estiver vazio, usa as padrão
        if (fontesSalvas) {
          const parsed = JSON.parse(fontesSalvas);
          fontes = (parsed && parsed.length > 0) ? parsed : FONTES_PADRAO;
        } else {
          fontes = FONTES_PADRAO;
        }

        salvarFontesLocal();

        document.getElementById('botToken').value = localStorage.getItem('yg_bot_token') || "";
        document.getElementById('chatId').value = localStorage.getItem('yg_chat_id') || "@YggdrasilNoticias";
        document.getElementById('geminiKey').value = localStorage.getItem('yg_gemini_key') || "";

        carregarFonteAtual();
      } catch (e) {
        console.error("Erro na inicialização:", e);
        fontes = FONTES_PADRAO;
        salvarFontesLocal();
      }
    };

    function salvarConfiguracoes() {
      localStorage.setItem('yg_bot_token', document.getElementById('botToken').value);
      localStorage.setItem('yg_chat_id', document.getElementById('chatId').value);
      localStorage.setItem('yg_gemini_key', document.getElementById('geminiKey').value);
    }

    function salvarFontesLocal() {
      localStorage.setItem('yg_fontes_custom', JSON.stringify(fontes));
      atualizarSelectPortais();
      renderizarTabelaPortais();
    }

    function restaurarPortaisPadrao() {
      if (confirm("Isso vai redefinir a lista de portais para a lista original. Continuar?")) {
        fontes = FONTES_PADRAO;
        salvarFontesLocal();
        carregarFonteAtual();
        alert("Portais restaurados com sucesso!");
      }
    }

    function atualizarSelectPortais() {
      const select = document.getElementById('selectFonte');
      select.innerHTML = '';
      fontes.forEach((f, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = f.nome;
        select.appendChild(opt);
      });
    }

    function renderizarTabelaPortais() {
      const tbody = document.getElementById('tabelaPortaisBody');
      tbody.innerHTML = '';
      fontes.forEach(f => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${f.nome}</b></td>
          <td><span style="color:${f.modo === 'Automático' ? '#2ecc71' : '#f1c40f'}">${f.modo || 'Manual'}</span></td>
          <td>${f.escaneado || 'Nunca'}</td>
          <td>${f.postado || 'Nunca'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function adicionarNovoPortal() {
      const nome = document.getElementById('novoNomePortal').value.trim();
      const url = document.getElementById('novaUrlPortal').value.trim();
      const modo = document.getElementById('novoModoPortal').value;

      if (!nome || !url) return alert('Preencha o nome e a URL.');

      fontes.push({ id: 'custom_' + Date.now(), nome, url, modo, escaneado: 'Nunca', postado: 'Nunca' });
      salvarFontesLocal();

      document.getElementById('novoNomePortal').value = '';
      document.getElementById('novaUrlPortal').value = '';
      alert(`Portal "${nome}" cadastrado com sucesso!`);
    }

    function removerPortalAtual() {
      if (fontes.length <= 1) return alert('Você precisa manter pelo menos um portal.');
      const idx = document.getElementById('selectFonte').value;

      if (confirm(`Remover portal "${fontes[idx].nome}"?`)) {
        fontes.splice(idx, 1);
        salvarFontesLocal();
        carregarFonteAtual();
      }
    }

    function obterNoticiasPostadas() {
      return JSON.parse(localStorage.getItem('yg_postados') || '[]');
    }

    function salvarNoticiaPostada(link) {
      let postados = obterNoticiasPostadas();
      if (!postados.includes(link)) {
        postados.push(link);
        localStorage.setItem('yg_postados', JSON.stringify(postados));
      }
    }

    function limparHistoricoPostados() {
      if (confirm("Deseja limpar o histórico de postados?")) {
        localStorage.removeItem('yg_postados');
        alert("Histórico limpo!");
        carregarFonteAtual();
      }
    }

    function obterFonteAtual() {
      const idx = document.getElementById('selectFonte').value;
      return fontes[idx];
    }

    async function carregarFonteAtual() {
      if (!fontes || fontes.length === 0) return;
      const idx = document.getElementById('selectFonte').value;
      const fonte = fontes[idx];

      document.getElementById('nomePortal').innerText = fonte.nome;
      document.getElementById('tituloNoticia').innerText = "Carregando notícias...";
      document.getElementById('statusGlobal').innerText = `Buscando dados de ${fonte.nome}...`;

      const agora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      fontes[idx].escaneado = agora;
      salvarFontesLocal();

      try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(fonte.url)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'ok' && data.items.length > 0) {
          const postados = obterNoticiasPostadas();
          itemsAtuais = data.items.filter(item => !postados.includes(item.link));

          if (itemsAtuais.length === 0) {
            document.getElementById('tituloNoticia').innerText = "🎉 Nenhuma notícia pendente neste portal!";
            document.getElementById('textoPost').value = "";
            document.getElementById('imagemNoticia').style.display = 'none';
            document.getElementById('indexNoticia').innerText = "0/0";
            document.getElementById('statusGlobal').innerText = "Sem pendências.";
            return;
          }

          indexAtual = 0;
          atualizarUI();
          document.getElementById('statusGlobal').innerText = "Conectado com sucesso!";
        } else {
          throw new Error('Sem itens');
        }
      } catch (err) {
        document.getElementById('tituloNoticia').innerText = "Erro ao acessar este portal.";
        document.getElementById('textoPost').value = "";
        document.getElementById('imagemNoticia').style.display = 'none';
        document.getElementById('statusGlobal').innerText = "Portal indisponível.";
      }
    }

    function extrairImagem(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      const match = (item.content || item.description || "").match(/<img[^>]+src=["']([^"']+)["']/i);
      return match ? match[1] : null;
    }

    function atualizarUI() {
      if (itemsAtuais.length === 0) return;
      const item = itemsAtuais[indexAtual];
      const fonte = obterFonteAtual();

      document.getElementById('indexNoticia').innerText = `${indexAtual + 1}/${itemsAtuais.length}`;
      document.getElementById('tituloNoticia').innerText = item.title;

      urlImagemAtual = extrairImagem(item);
      const imgElement = document.getElementById('imagemNoticia');
      if (urlImagemAtual) {
        imgElement.src = urlImagemAtual;
        imgElement.style.display = 'block';
      } else {
        imgElement.style.display = 'none';
      }

      let desc = (item.description || item.content || "").replace(/<[^>]*>?/gm, '').trim();
      if (desc.length > 600) desc = desc.substring(0, 600) + '...';

      const tagFonte = '#' + fonte.nome.replace(/\s+/g, '');
      const hashtags = `#YggdrasilNoticias #YggdrasilAnimes #Geek #Otaku ${tagFonte}`;

      document.getElementById('textoPost').value = `🗞️ <b>PORTAL YGGDRASIL | ${fonte.nome}</b>\n\n🔥 <b>${item.title}</b>\n\n${desc}\n\n📖 Quer saber mais? <a href="${item.link}">Leia a matéria completa no site!</a>\n\n💡 <i>Créditos ao portal ${fonte.nome}</i>\n───\n🌳 Faça parte do nosso canal principal: @YggdrasilAnimes\n\n${hashtags}`;
    }

    function trocarNoticia(direcao) {
      if (itemsAtuais.length === 0) return;
      indexAtual += direcao;
      if (indexAtual < 0) indexAtual = itemsAtuais.length - 1;
      if (indexAtual >= itemsAtuais.length) indexAtual = 0;
      atualizarUI();
    }

    function trocarPortal() { carregarFonteAtual(); }

    function proximoPortal() {
      const select = document.getElementById('selectFonte');
      select.value = (parseInt(select.value) + 1) % fontes.length;
      carregarFonteAtual();
    }

    async function resumirComGemini() {
      salvarConfiguracoes();
      const apiKey = document.getElementById('geminiKey').value.trim();
      if (!apiKey) return alert('Insira a sua chave do Gemini.');

      const item = itemsAtuais[indexAtual];
      if (!item) return;

      document.getElementById('textoPost').value = "Gerando resumo via IA Gemini...";

      try {
        const prompt = `Faça um resumo atrativo para leitores geek/otaku sobre a notícia: "${item.title}". Resumo: "${item.description.replace(/<[^>]*>?/gm, '')}"`;
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
          const resumo = data.candidates[0].content.parts[0].text.trim();
          const fonte = obterFonteAtual();
          const tagFonte = '#' + fonte.nome.replace(/\s+/g, '');
          const hashtags = `#YggdrasilNoticias #YggdrasilAnimes #Geek #Otaku ${tagFonte}`;
          
          document.getElementById('textoPost').value = `🗞️ <b>PORTAL YGGDRASIL | ${fonte.nome}</b>\n\n🔥 <b>${item.title}</b>\n\n${resumo}\n\n📖 Quer saber mais? <a href="${item.link}">Leia a matéria completa no site!</a>\n\n💡 <i>Créditos ao portal ${fonte.nome}</i>\n───\n🌳 Faça parte do nosso canal principal: @YggdrasilAnimes\n\n${hashtags}`;
        } else {
          atualizarUI();
        }
      } catch (e) {
        alert('Erro na conexão com Gemini.');
        atualizarUI();
      }
    }

    async function enviarDiretoTelegram() {
      salvarConfiguracoes();

      const botToken = document.getElementById('botToken').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      const texto = document.getElementById('textoPost').value;
      const idx = document.getElementById('selectFonte').value;
      const itemAtual = itemsAtuais[indexAtual];

      if (!botToken) return alert('Por favor, digite o Token do Bot.');

      document.getElementById('statusGlobal').innerText = "Enviando para o Telegram...";

      let sucesso = false;

      // 1. Tentar Enviar com Foto
      if (urlImagemAtual) {
        try {
          const endpoint = `https://api.telegram.org/bot${botToken}/sendPhoto`;
          const payload = { chat_id: chatId, photo: urlImagemAtual, caption: texto, parse_mode: 'HTML' };

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.ok) sucesso = true;
        } catch (e) {
          console.log("Falha no envio da imagem, tentando texto apenas...");
        }
      }

      // 2. Fallback: Enviar apenas texto
      if (!sucesso) {
        try {
          const endpoint = `https://api.telegram.org/bot${botToken}/sendMessage`;
